
{% extends "base.html" %}
{% block titulo %}Iniciar sesión · StyleBook{% endblock %}

{% block contenido %}

<!-- INICIO AGREGADO JESUS: diseño de inicio de sesión StyleBook. -->
<section class="auth-diseno">

    <aside class="auth-panel-marca">
        <!-- INICIO AGREGADO JESUS: logo en autenticación. -->
        <div class="auth-marca-logo">
            <span class="logo-stylebook-imagen" role="img" aria-label="StyleBook"></span>
        </div>
        <!-- FIN AGREGADO JESUS: logo en autenticación. -->

        <div class="auth-frase-inferior">
            Cuida tu estilo,
            <br>siempre ♡
        </div>
    </aside>

    <div class="auth-panel-formulario">

        <div class="auth-formulario-contenido">
            <span class="auth-superior">BIENVENIDO A STYLEBOOK</span>

            <h1>Iniciar sesión</h1>

            <p class="auth-descripcion">
                Accede a tu cuenta y disfruta de todos nuestros servicios.
            </p>

            <form method="POST" class="auth-formulario">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

                <label for="email">Correo electrónico</label>
                <div class="auth-campo">
                    <span aria-hidden="true">✉</span>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Correo electrónico"
                        autocomplete="email"
                        required
                    />
                </div>

                <label for="password">Contraseña</label>
                <div class="auth-campo">
                    <span aria-hidden="true">♙</span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        required
                    />
                </div>

                <button type="submit" class="auth-boton-principal">
                    Iniciar sesión <span>→</span>
                </button>
            </form>

            <div class="auth-separador">
                <span></span>
                <small>STYLEBOOK</small>
                <span></span>
            </div>

            <p class="auth-cambio">
                ¿No tienes una cuenta?
                <a href="{{ url_for('auth.registro') }}">Regístrate</a>
            </p>
        </div>

    </div>

</section>
<!-- FIN AGREGADO JESUS: diseño de inicio de sesión StyleBook. -->

{% endblock %}
